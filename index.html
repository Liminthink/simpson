      return new Proxy(root, {

          With(t.list(Number(p)), u => ks ??= [idx].concat(Object.getOwnPropertyNames(u.__proto__).filter(k => !BAD_GUYS.includes(k)))), {
          get: (o, k) => {
            if (k === idx) return Number(root.dts(p));
            let val = typeof o[k] === 'function' ? o[k]() : o[k];
            return (k === 'dt1' && val !== null) ? Number(val) : val;
          },
          ownKeys: () => ks,
          getOwnPropertyDescriptor: (o, k) =>
            ks.includes(k) ? { enumerable: true, configurable: true, value: o[k] } : undefined

    // 1. 辅助函数：根据 'YYYY-MM-DD' 获取该日期属于当年第几周 (ISO-8601 标准)
    const getISOWeek = (dateStr) => {
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return '未知周';

      // 调整到周四（ISO周的标准：包含当年第一个周四的周为第一周）
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + 4 - (date.getDay() || 7));

      const yearStart = new Date(date.getFullYear(), 0, 1);
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    },

      mapDragRect = u => u.on('boxzoomend', function (e) {
        // e.boxZoomBounds 就是你用 Shift 键拉出来的矩形范围
        const containerBounds = e.boxZoomBounds;

        // 遍历 GeoJSON 图层中的每一个要素
        gis.eachLayer(function (layer) {
          // 如果是点要素（Marker / CircleMarker）
          if (layer.getLatLng && containerBounds.contains(layer.getLatLng())) {
            // 该要素在框选范围内，改变其样式或将其加入选中列表
            layer.setStyle({ color: 'red' });
          }

          // 如果是线或面要素（Polyline / Polygon）
          else if (layer.getBounds && containerBounds.intersects(layer.getBounds())) {
            // 判断其边界是否与框选范围相交
            layer.setStyle({ color: 'red' });
          }
        });
      })

    function rasterizeEmoji(emoji, size = 60) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 设置字体，确保 Emoji 居中
      ctx.font = `${size * 0.8}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 可以选择在这里加自定义发光或阴影
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = 4;

      // 绘制 Emoji
      ctx.fillText(emoji, size / 2, size / 2);

      return canvas.toDataURL(); // 返回 base64 字符串
    }
